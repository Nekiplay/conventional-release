versioning:
  update-major: []
  update-minor: [feat]
  update-patch: [build, ci, chore, fix, perf, refactor, test]

tag:
  pattern: "v%d.%d.%d"
  filter: "v*.*.*"

commit-message:
  # `generate-changelog` uses this list to decide which commits are user-facing.
  # Kept in sync with the sections below so both code paths agree.
  types: [build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]

release-notes:
  sections:
  - name: Features
    section-type: commits
    commit-types: [feat]
  - name: Bug Fixes
    section-type: commits
    commit-types: [fix]
  - name: Performance
    section-type: commits
    commit-types: [perf]
  - name: Other Changes
    section-type: commits
    commit-types: [build, chore, ci, docs, refactor, revert, style, test]
  - name: Breaking Changes
    section-type: breaking-changes
