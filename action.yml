name: conventional-release
description: Generates a new version and tag based on conventional commits

branding:
  icon: tag
  color: blue

inputs:
  token:
    description: Token used to push git tag
    default: ${{ github.token }}
  auto-release:
    description: If 'true', creates a release automatically whenever a release-worthy commit is pushed (indicated by commit message) to the release branch.
    default: true
  release-branch:
    description: Name of the branch releases should be created from when auto-release enabled
    default: main
  update-major-tag:
    description: If 'true', force-pushes a git tag for the major version
    default: false
  ignore-commits-before:
    description: The commit SHA to start the commit message validation from
  manual-version:
    description: |
      Release this exact version instead of deriving it from the commit log.
      Accepts any number of dot-separated numeric segments (e.g. 2.0.4, 2.0.4.2.1)
      with an optional prerelease suffix. When set, the workflow does not need to
      be triggered by a tag push, which allows workflow_dispatch driven releases.
  validate-commit-messages:
    description: |
      If 'true', fail the build when a commit message does not follow Conventional
      Commits. If 'false' (default), such commits are only reported and end up in
      the 'Other Changes' section of the release notes. Required for repositories
      that adopted Conventional Commits after their initial commits.
    default: false
  github-release-title:
    description: |
      Title of the GitHub Release. Defaults to the tag name.
      Supports the '%s' placeholder, replaced with the release version.
  github-release-notes-prepend:
    description: |
      Markdown placed at the very top of the release notes, above the generated
      changelog. Useful for badges (downloads, version, CI status).
      Supports the '%s' placeholder, replaced with the release version, so a
      version badge does not have to be updated for every release.
      Example:
        '![Version](https://img.shields.io/badge/version-%s-blue)'
  commit-files:
    description: |
      Create a new commit including the specified files and tag it.
      Multiple files can be separated by whitespace.
  tag-push-enabled:
    description: |
      Set this to false to skip pushing the git tag during the release.
      Disable tag pushing when another tool (e.g. goreleaser) pushes the tag.
    default: true
  github-release-enabled:
    description: Create GitHub Release
    default: true
  github-release-draft:
    description: Create the GitHub Release as draft
    default: false
  github-release-prerelease:
    description: Create the GitHub Release as prerelease
    default: false
  github-release-latest:
    description: Mark GitHub Release as latest
    default: true
  github-release-files:
    description: Attach workspace files to the GitHub Release
  ref:
    description: Git ref
    default: ${{ github.ref }}
  enabled:
    description: internal property, workaround to get job status, don't specify explicitly
    default: ${{ job.status == 'success' }}

outputs:
  version:
    description: Next version
  publish:
    description: Is 'true' when release build, otherwise empty (truthy false)

runs:
  using: docker
  image: Dockerfile
  entrypoint: prepare-release
  post-entrypoint: complete-release
  env:
    IGNORE_COMMITS_BEFORE: ${{ inputs.ignore-commits-before }}
    VALIDATE_COMMIT_MESSAGES: ${{ inputs.validate-commit-messages }}
    MANUAL_VERSION: ${{ inputs.manual-version }}
    RELEASE_BRANCH: ${{ inputs.release-branch }}
    GIT_TOKEN: ${{ inputs.token }}
    GIT_REF: ${{ inputs.ref }}
    ENABLED: ${{ inputs.enabled }}
    COMMIT_FILES: ${{ inputs.commit-files }}
    GITHUB_RELEASE_ENABLED: ${{ inputs.github-release-enabled }}
    GITHUB_RELEASE_TITLE: ${{ inputs.github-release-title }}
    GITHUB_RELEASE_NOTES_PREPEND: ${{ inputs.github-release-notes-prepend }}
    GITHUB_RELEASE_DRAFT: ${{ inputs.github-release-draft }}
    GITHUB_RELEASE_PRERELEASE: ${{ inputs.github-release-prerelease }}
    GITHUB_RELEASE_LATEST: ${{ inputs.github-release-latest }}
    GITHUB_RELEASE_FILES: ${{ inputs.github-release-files }}
    UPDATE_MAJOR_TAG: ${{ inputs.update-major-tag }}
    TAG_PUSH_ENABLED: ${{ inputs.tag-push-enabled }}
    AUTO_RELEASE: ${{ inputs.auto-release }}
